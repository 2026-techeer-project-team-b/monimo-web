# 바뀐 파일 위치 -> area 라벨 규칙 (.github/workflows/pr-labeler.yml 이 사용)

area/server-map:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/server-map/**'

area/transactions:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/transactions/**'

area/inspector:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/inspector/**'

area/errors:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/errors/**'

area/logs:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/logs/**'

area/alerts:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/alerts/**'

area/settings:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/settings/**'

area/platform:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/features/platform/**'

area/api:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/api/**'

area/design-system:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/design-system/**'

area/build:
  - changed-files:
    - any-glob-to-any-file:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'nginx.conf'

area/ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

area/docs:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**'
      - '**/*.md'
